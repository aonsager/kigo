name: afk-ci

# Clean-checkout build+test gate for the afk- loop, on macOS (expensive: macOS
# Actions minutes bill at 10x). Scoped to integration->main PRs only — NOT per
# slice, and NOT on push to main (that re-ran the same commit the PR already
# tested, double-billing macOS minutes). Slice PRs target integration/* and are
# verified by
# afk-advance re-running the suite in-session, plus the trivial slice-gate check.
# Tolerant: while the repo has no XcodeGen manifest yet (pre walking-skeleton)
# the job exits 0; once project.yml exists it really builds and tests — never
# relax that into an unconditional pass.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: afk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  afk-ci:
    name: afk-ci
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SCHEME: Kigo
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${latest:-}" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Resolve & boot an iOS simulator
        run: |
          set -euo pipefail
          if [ ! -f project.yml ]; then
            echo "No project.yml yet — pre walking-skeleton. Skipping simulator resolve."
            exit 0
          fi
          # Pin to a CONCRETE simulator UDID resolved at runtime rather than a static
          # name=iPhone 17 destination. A hardcoded name/OS is brittle: GitHub runner
          # images vary which devices and iOS runtimes they ship, and an unresolvable
          # name fails the whole job in ~90s with "Unable to find a device matching..."
          # (it did once on this repo). Picking the newest available iPhone simulator on
          # whatever runner we landed on is deterministic across image drift.
          #
          # The resolver script is passed via `python3 -c` reading the device list from a
          # FILE — NOT a `python3 - <<heredoc` piped from simctl, which would make Python
          # read its program from stdin and collide with the JSON on the same stream.
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json"
          UDID=$(python3 -c '
          import json, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          best = None  # (version_tuple, name, udid)
          for runtime, devs in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      if best is None or version > best[0]:
                          best = (version, d["name"], d["udid"])
          sys.stderr.write(("Resolved: %s (iOS %d.%d)\n" % (best[1], best[0][0], best[0][1])) if best else "none\n")
          print(best[2] if best else "")
          ' "$RUNNER_TEMP/sims.json")
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Resolved simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"

      - name: Build and test (or pass if no manifest yet)
        run: |
          set -euo pipefail
          if [ ! -f project.yml ]; then
            echo "No project.yml yet — pre walking-skeleton. Passing tolerantly."
            exit 0
          fi
          echo "project.yml present — generating project and running tests."
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

          # --- No-progress watchdog (replaces the old fixed 1200s perl-alarm cap) ---
          #
          # A fixed wall-clock cap on the whole `xcodebuild test` invocation
          # conflates two concerns — catching a HANG vs. bounding a healthy
          # suite's runtime — so a legitimately-growing UI suite eventually trips
          # a gate meant for hangs (this is what wedged PR #203: every test
          # passed, the suite just ran past 1200s). Separate the concerns:
          #   * a single test wedges  -> -default-test-execution-time-allowance 120
          #   * whole runner/sim wedge, no progress at all -> THIS watchdog
          #   * ultimate backstop     -> the job's `timeout-minutes: 45`
          # The watchdog kills xcodebuild only after SILENCE_LIMIT seconds with no
          # new log output. Healthy runs print constantly (per-test lines, plus
          # `t = N.Ns` polling lines ~1/s during element waits), so it never fires
          # on a slow-but-progressing suite — only on a true hang, and it fires
          # FASTER than 1200s did when something is genuinely stuck. See CLAUDE.md
          # "Why the flags" for the full rationale.
          SILENCE_LIMIT=300   # 5 min of total silence == stuck (tune toward 180 if desired)

          : > xcodebuild.log            # create + timestamp the log up front

          # Own process group (set -m) so we can kill the whole xcodebuild/sim tree
          # (macOS has no `setsid`). Best-effort — the runner is ephemeral, so what
          # matters is that the step exits non-zero promptly on a hang.
          set -m
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 &
          XCB_PID=$!
          set +m

          tail -f xcodebuild.log & TAIL_PID=$!   # live output to the CI console

          # Poll the log's mtime; if it stops advancing, xcodebuild is stuck.
          killed_by_watchdog=0
          while kill -0 "$XCB_PID" 2>/dev/null; do
            sleep 15
            last=$(stat -f %m xcodebuild.log 2>/dev/null || echo 0)   # BSD/macOS stat
            now=$(date +%s)
            if [ "$((now - last))" -ge "$SILENCE_LIMIT" ]; then
              echo "::error::No test output for ${SILENCE_LIMIT}s — treating as a hang; killing xcodebuild."
              kill -TERM -"$XCB_PID" 2>/dev/null || kill -TERM "$XCB_PID" 2>/dev/null
              sleep 10
              kill -KILL -"$XCB_PID" 2>/dev/null || kill -KILL "$XCB_PID" 2>/dev/null
              killed_by_watchdog=1
              break
            fi
          done

          # `if wait` so a non-zero test exit doesn't abort under `set -e` before
          # we can report it.
          if wait "$XCB_PID"; then XCB_STATUS=0; else XCB_STATUS=$?; fi
          kill "$TAIL_PID" 2>/dev/null || true

          if [ "$killed_by_watchdog" -eq 1 ]; then
            echo "afk-ci failed: xcodebuild hung (no progress for ${SILENCE_LIMIT}s)."
            exit 1
          fi
          [ "$XCB_STATUS" -eq 0 ] && grep -q '\*\* TEST SUCCEEDED \*\*' xcodebuild.log
